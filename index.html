    <style>
        :root {
            --media-transition-speed: 300ms;
        }

        body {
            margin: 0;
            font-family: Roboto, Arial;
            background: #111;
            color: #fff;
            height: 100vh !important;
        }

        h2 {
            font-size: 36px;
        }

        p {
            font-size: 26px;
        }

        button {
            background-color: transparent;
            border: none;
        }

        /* Scrollbars */

        .app-area-container,
        .sidebar {
            overflow-y: scroll;
            scrollbar-width: auto;
            scrollbar-color: rgba(49, 49, 49, 0.5) transparent;
            scroll-behavior: smooth;
        }

        .app-area-container::-webkit-scrollbar,
        .sidebar::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        .app-area-container::-webkit-scrollbar-track,
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 10px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.1);
        }

        .app-area-container::-webkit-scrollbar-track:hover,
        .sidebar::-webkit-scrollbar-track:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .app-area-container::-webkit-scrollbar-thumb:hover,
        .sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .app-area-container::-webkit-scrollbar-thumb:active,
        .sidebar::-webkit-scrollbar-thumb:active {
            background: rgba(0, 0, 0, 1);
        }

        .app-area-container::-webkit-scrollbar-button,
        .sidebar::-webkit-scrollbar-button {
            display: none;
            width: 0;
            height: 0;
        }

        .app-area-container::-webkit-scrollbar-corner,
        .sidebar::-webkit-scrollbar-corner {
            background: transparent;
        }

        /* App Area */
        #appArea {
            padding: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .app-area-container {
            display: block;
            width: 100%;
            height: 100%;
        }


        .section {
            margin-bottom: 70px;
        }

        .section h2 {
            margin: 10px 0 24px 0;
            padding-left: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 14px;
        }

        /* CARD -----------------------*/
        .card {
            background: #212121;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #333;
        }

        .card h3 {
            font-size: 24px;
            margin: 10px;
            text-align: center;
        }

        /* App Page -----------------------*/

        #appPage {
            position: fixed;
            z-index: 10000;
            display: none;
            background-color: black;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 180ms ease-in-out, transform 180ms ease-in-out;
            display: block !important;
            pointer-events: none;
        }

        #appPage.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        #page-container {
            display: flex;
            width: 100%;
            height: 100%;
            background-color: #111111;
        }

        #pageTitle {
            font-size: 50px;
        }

        .showcase {
            width: 70%;
            height: 100%;
            max-height: 100vh;
            align-content: center;
            padding: 20px 3%;
            box-sizing: border-box;

        }

        .showcase-inner {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            height: 100%;
            align-content: center;
        }

        .media-container {
            height: auto;
            max-height: 675px;
        }

        #pageMedia {
            width: 100%;
            max-width: 100%;
            height: 100%;
            margin-bottom: 30px;
            opacity: 1;
            transition: opacity var(--media-transition-speed) ease-in-out;
            text-align: center;
            justify-content: center;
            align-content: center;
        }

        #pageMedia * {
            max-width: 100%;
            max-height: 675px;
            margin: 0 auto;
        }

        #pageMedia.fade {
            opacity: 0;
        }

        #pageThumbnails {
            display: flex;
            width: 100%;
        }

        #pageThumbnails img {
            max-height: 150px;
            padding: 0 10px;
            cursor: pointer;
            max-width: 100%;
            height: auto;
            box-sizing: border-box;
        }

        .sidebar {
            box-sizing: border-box;
            background-color: rgb(0, 0, 0);
            width: 30%;
            padding: 30px;
            display: flex;
            overflow-y: auto;

        }

        .sidebar-inner {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .tag {
            display: inline-block;
            background: #326dc5;
            padding: 4px 12px;
            margin: 6px;
            border-radius: 50px;
            font-size: 22px;
        }

        .tag-alt {
            margin: 8px 0;
            font-size: 18px;
            opacity: 0.7;
        }

        #pageHardware {
            /* display: flex;
            flex-direction: row;
            flex-wrap: wrap;*/
        }

        #backButton {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 10000;
            display: flex;
            cursor: pointer;
        }

        #backButton img {
            width: 50px;
            aspect-ratio: 1 / 1;
        }

        #backButton img:hover {
            transform: scale(1.05);
        }

        .app-icon {
            width: 30px;
            aspect-ratio: 1 / 1;
            background-color: white;
        }

        .os-logo {
            width: 30px;
            aspect-ratio: 1 / 1;
            margin-right: 6px;
        }

        .app-cell {
            display: flex;
            align-items: center;
            margin: 10px 10px;
            font-size: 22px;
        }

        .app-cell>div {
            margin-right: 10px;
        }

        .app-container {
            display: flex;
            flex-direction: column;
        }

        .icon {
            background-color: currentColor;
            mask: var(--icon) no-repeat center / contain;
            -webkit-mask: var(--icon) no-repeat center / contain;
            color: white;
        }

        .row {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
        }

        .fluidMedia16x9 * {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .fluidMedia16x9 {
            position: relative;
            padding-bottom: 56.25%;
            /* proportion value to aspect ratio 16:9 (9 / 16 = 0.5625 or 56.25%) */
            height: 0;
            overflow: hidden;
            background-color: black;
            background-size: contain;
            background-repeat: no-repeat;
            box-sizing: border-box;
        }

        .show {
            display: block !important;
        }

        .img-fluid {
            max-width: 100%;
            height: auto;
        }

        @media (max-aspect-ratio: 3/2) {
            .showcase {
                width: 65%;
            }

            .sidebar {
                width: 35%;
            }
        }

        @media (max-aspect-ratio: 1/1) {

            #page-container {
                flex-direction: column;
                overflow-y: scroll;
            }

            .showcase {
                width: 100%;
                height: auto;
                display: block;
            }

            #pageMedia {
                height: auto;
                margin-bottom: 0px;
            }

            .sidebar {
                display: block;
                width: 100%;
                box-sizing: border-box;
                overflow: visible;
                height: auto;
            }

            #backButton {
                position: relative;
                display: block;
                top: 0px;
                left: auto;
                margin: 20px 15px;
            }

            #backButton img {
                width: 40px;
            }
        }
    </style>
</head>

        var current = null;

        function renderHome() {
            current = null;

            // Define section types from the available sections in the JSON data.
            var sections = {};
            for (var i = 0; i < DATA.length; i++) {
                var item = DATA[i];
                if (!sections[item.section]) sections[item.section] = [];
                sections[item.section].push(item);
            }

            // Create app cards
            var appHTML = "";

            for (var key in sections) {
                appHTML += "<div class='section'>";
                appHTML += "<h2>" + key + "</h2>";
                appHTML += "<div class='grid'>";

                for (var j = 0; j < sections[key].length; j++) {
                    var item = sections[key][j];
                    appHTML += "<div class='card' onclick=\"openApp('" + item.title + "')\">";
                    appHTML += "<img src='" + (item.thumbnail || "") + "'>";
                    appHTML += "<h3>" + item.title + "</h3>";
                    appHTML += "</div>";
                }

                appHTML += "</div></div>";
            }

            appArea.innerHTML = appHTML;
        }

        // OPEN PAGE RELATED ======================================

        var appArea = document.getElementById("appArea");
        var pageTitle = document.getElementById("pageTitle");
        var pageDescription = document.getElementById("pageDescription");
        var pageSkills = document.getElementById("pageSkills");
        var pageHardware = document.getElementById("pageHardware");
        var pageThumbnails = document.getElementById("pageThumbnails");

        // Apps Area
        var windowsApp = document.getElementById("pageWindowsApp");
        var websiteApp = document.getElementById("pageWebsiteApp");
        var appleOSApp = document.getElementById("pageAppleOSApp");
        var androidApp = document.getElementById("pageAndroidApp");

        function setMedia(i) {

            if (!current || !current.media) return;

            var el = document.getElementById("pageMedia");
            el.classList.add("fade");
            var speed = getComputedStyle(document.documentElement).getPropertyValue("--media-transition-speed");
            speed = parseFloat(speed);

            setTimeout(function () {
                el.innerHTML = current.media[i].content;
                el.classList.remove("fade");
            }, speed);
        }

        function openApp(title) {

            document.getElementById("appPage").classList.toggle("show");

            var item = null;
            for (var i = 0; i < DATA.length; i++) {
                if (DATA[i].title === title) { item = DATA[i]; break; }
            }
            if (!item) return;

            current = item;
            pageTitle.innerText = item.title;
            pageDescription.innerText = item.description;

            windowsApp.innerText = item.windowsApp;
            websiteApp.innerText = item.websiteApp;
            appleOSApp.innerText = item.appleOSApp;
            androidApp.innerText = item.androidApp;

            // Skills area
            var skillsHTML = "";
            if (item.skills && item.skills.length) {
                for (var s = 0; s < item.skills.length; s++) {
                    skillsHTML += "<span class='tag'>" + item.skills[s] + "</span>";
                }
            }
            pageSkills.innerHTML = skillsHTML;

            // Hardware area 
            var hardwareHTML = "";

            if (item.hardware && item.hardware.length) {

                var firstGroupFound = false;

                for (var h = 0; h < item.hardware.length; h++) {
                    var block = item.hardware[h];

                    /* OR GROUPS */
                    if (Object.prototype.toString.call(block) === "[object Array]") {
                        if (firstGroupFound) {
                            hardwareHTML += "<div class='tag-alt'>OR</div>";
                        }

                        firstGroupFound = true;

                        hardwareHTML += "<div style='margin-bottom:10px;'>";

                        for (var i = 0; i < block.length; i++) {
                            hardwareHTML += "<span class='tag'>" + block[i] + "</span>";

                            if (i < block.length - 1) {
                                hardwareHTML += " + ";
                            }
                        }

                        hardwareHTML += "</div>";

                    }

                    // Regular items 
                    else {

                        hardwareHTML += "<div style='margin-bottom:10px;'>";
                        hardwareHTML += "<span class='tag'>" + block + "</span>";
                        hardwareHTML += "</div>";

                    }

                }

            }

            pageHardware.innerHTML = hardwareHTML;

            // Showcase area

            pageMedia.innerHTML = "";
            pageThumbnails.innerHTML = "";

            if (item.media && item.media.length) {

                pageMedia.innerHTML = item.media[0].content;

                var thumbHTML = "";

                for (var j = 0; j < item.media.length; j++) {
                    thumbHTML += "<div onclick='setMedia(" + j + ")'>";
                    thumbHTML += "<img src='" + item.media[j].thumb + "'>";
                    thumbHTML += "</div>";
                }

                pageThumbnails.innerHTML = thumbHTML;
            }

        }

        function closeAppPage() {
            document.getElementById("appPage").classList.toggle("show");
        }

        renderHome();

        //openApp("Digital Painting"); // For Testing
    </script>
